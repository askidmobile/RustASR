[workspace]
resolver = "2"
members = [
    "crates/asr-core",
    "crates/audio",
    "crates/aut-encoder",
    "crates/qwen3-decoder",
    "crates/asr-pipeline",
    "crates/asr-cli",
    "crates/model-whisper",
    "crates/model-gigaam",
    "crates/model-parakeet",
    "crates/model-qwen3",
    "crates/asr-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["RustASR Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/rustasr"
keywords = ["asr", "speech-recognition", "qwen", "audio", "machine-learning"]
categories = ["multimedia::audio", "science::machine-learning"]

[workspace.dependencies]
# Core crates (internal)
asr-core = { path = "crates/asr-core" }
audio = { path = "crates/audio" }
aut-encoder = { path = "crates/aut-encoder" }
qwen3-decoder = { path = "crates/qwen3-decoder" }
model-whisper = { path = "crates/model-whisper" }
model-gigaam = { path = "crates/model-gigaam" }
model-parakeet = { path = "crates/model-parakeet" }
model-qwen3 = { path = "crates/model-qwen3" }
asr-engine = { path = "crates/asr-engine" }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging and metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# ML / Tensor backend — askidmobile candle-fork 0.9.2 (общий с Yttri).
# Содержит Metal patches: compute_per_buffer=15, sync per layer, native dequantize_f16.
# См. [patch] секцию ниже — резолвится в локальный ../candle-fork/.
#
# Features=["metal"] здесь НЕ выставлен сознательно: workspace.dependencies не
# поддерживает target.'cfg'-cond, а cargo unifies features across targets —
# в результате metal активировался бы на Linux/Windows и тянул бы apple-only
# candle-metal-kernels → objc2 → compile fail. Yttri активирует metal через
# свою [target.cfg(target_os="macos")'.dependencies] секцию, что достаточно
# для production-сборки. Standalone RustASR build на macOS потеряет metal
# до тех пор, пока не понадобится — тогда добавим per-crate target-cond.
candle-core = { git = "https://github.com/askidmobile/candle.git", branch = "master" }
candle-nn = { git = "https://github.com/askidmobile/candle.git", branch = "master" }
candle-transformers = { git = "https://github.com/askidmobile/candle.git", branch = "master" }
candle-metal-kernels = { git = "https://github.com/askidmobile/candle.git", branch = "master" }
safetensors = "0.5"

# Tokenization
tokenizers = "0.21"

# Audio processing
hound = "3.5"           # WAV I/O
rubato = "0.16"         # Resampling
rustfft = "6.2"         # FFT for spectrogram
webrtc-vad = "0.4"      # VAD (WebRTC)

# CLI
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"      # Progress bars

# Testing & Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Utilities
byteorder = "1.5"
parking_lot = "0.12"
rand = "0.8"
once_cell = "1.20"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# ============================================
# Локальный candle-fork (0.9.2) — общий с Yttri.
# Patch резолвит git deps на локальные пути для быстрой итерации
# и применения Yttri-патчей (Metal compute_per_buffer=15, per-layer sync, etc).
# ============================================
[patch."https://github.com/askidmobile/candle.git"]
candle-core = { path = "../candle-fork/candle-core" }
candle-nn = { path = "../candle-fork/candle-nn" }
candle-transformers = { path = "../candle-fork/candle-transformers" }
candle-metal-kernels = { path = "../candle-fork/candle-metal-kernels" }
candle-ug = { path = "../candle-fork/candle-ug" }
